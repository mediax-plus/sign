name: MX image

on:
  push:
    tags:
      - 'mx-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_push:
    name: Build and push the image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A run started by hand from a branch gets a sha-<commit> tag instead of the tag name.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mediax-plus/sign
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,enable=${{ github.ref_type != 'tag' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/mediax-plus/sign
            org.opencontainers.image.title=sign

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
